<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mercati — Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;--panel:#0A0A0A;--panel-2:#111111;--border:#232323;--border-soft:#1A1A1A;
    --text:#F2F2F2;--muted:#8A8A8A;--accent:#57B8FF;--accent-text:#061019;--up:#4CAF7D;--down:#E0616B;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.55;position:relative;}
  a{color:inherit;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 24px;}

  .bg-fx{position:fixed;inset:0;z-index:-1;overflow:hidden;}
  .bg-fx::before{content:'';position:absolute;width:55vw;height:55vw;border-radius:50%;background:radial-gradient(circle, rgba(87,184,255,0.14), transparent 70%);top:-18%;left:-12%;filter:blur(10px);animation:drift1 24s ease-in-out infinite alternate;}
  .bg-fx::after{content:'';position:absolute;width:48vw;height:48vw;border-radius:50%;background:radial-gradient(circle, rgba(76,175,125,0.08), transparent 70%);bottom:-16%;right:-10%;filter:blur(10px);animation:drift2 28s ease-in-out infinite alternate;}
  .bg-grid{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(87,184,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(87,184,255,0.05) 1px, transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 100%);}
  @keyframes drift1{from{transform:translate(0,0);}to{transform:translate(6%,8%);}}
  @keyframes drift2{from{transform:translate(0,0);}to{transform:translate(-7%,-6%);}}

  .reveal{opacity:0;transform:translateY(14px);transition:opacity 0.6s ease, transform 0.6s ease;}
  .reveal.in{opacity:1;transform:translateY(0);}

  header{border-bottom:1px solid var(--border);padding:18px 0 14px;text-align:center;}
  .logo{font-size:19px;font-weight:700;margin-bottom:8px;}
  .logo em{font-style:normal;color:var(--accent);}
  nav{display:flex;gap:22px;font-size:13.5px;color:var(--muted);justify-content:center;}
  nav a{text-decoration:none;transition:color 0.15s ease;}
  nav a:hover{color:var(--text);}
  nav a.current{color:var(--accent);}

  .page-hero{text-align:center;padding:38px 0 26px;}
  .page-hero h1{font-size:clamp(30px,5vw,44px);font-weight:800;letter-spacing:-1px;margin:0 0 10px;}
  .page-hero p{color:var(--muted);font-size:14.5px;margin:0;}

  main{padding:10px 0 64px;}

  .cat-section{margin-bottom:40px;}
  .cat-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
  .cat-head h2{font-size:16px;font-weight:700;margin:0;}
  .cat-head span{font-size:12px;color:var(--muted);}

  .instr-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));gap:1px;background:var(--border);border:1px solid var(--border);}
  .instr-card{background:var(--panel);padding:18px;cursor:pointer;transition:background 0.15s ease, transform 0.15s ease, box-shadow 0.2s ease;}
  .instr-card:hover{background:var(--panel-2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(87,184,255,0.12);}
  .instr-card .name{font-size:12.5px;color:var(--muted);margin-bottom:2px;}
  .instr-card .sym{font-size:11px;color:var(--accent);letter-spacing:0.4px;margin-bottom:10px;}
  .instr-card .price{font-family:'IBM Plex Mono',monospace;font-size:18px;margin-bottom:4px;}
  .instr-card .chg{font-family:'IBM Plex Mono',monospace;font-size:12.5px;}
  .up{color:var(--up);}
  .down{color:var(--down);}

  .dots{display:inline-flex;gap:5px;align-items:center;padding:6px 0;}
  .dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce 1.1s infinite ease-in-out;}
  .dots span:nth-child(2){animation-delay:0.15s;}
  .dots span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{0%, 80%, 100%{transform:translateY(0);opacity:0.5;}40%{transform:translateY(-6px);opacity:1;}}
  #status-msg{color:var(--muted);font-size:13.5px;padding:10px 0;}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);align-items:center;justify-content:center;padding:20px;z-index:50;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--border);max-width:520px;width:100%;padding:28px;max-height:85vh;overflow-y:auto;}
  .modal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .modal-top h3{font-size:22px;margin:0;}
  .modal-close{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;line-height:1;}
  .modal-close:hover{color:var(--text);}
  .modal-sym{color:var(--accent);font-size:13px;letter-spacing:0.4px;margin-bottom:18px;}
  .modal-price-row{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;}
  .modal-price{font-family:'IBM Plex Mono',monospace;font-size:28px;}
  .modal-chart{width:100%;height:80px;margin-bottom:12px;}
  .modal-blurb{color:var(--muted);font-size:14.5px;line-height:1.6;}

  footer{border-top:1px solid var(--border);padding:22px 0;color:var(--muted);font-size:12.5px;text-align:center;}
</style>
</head>
<body>

<div class="bg-fx"></div>
<div class="bg-grid"></div>

<header>
  <div class="wrap">
    <div class="logo">Meridian<em>.</em></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="news.html">Notizie</a>
      <a href="mercati.html" class="current">Mercati</a>
      <a href="school.html">Scuola del Trading</a>
      <a href="chat.html">Assistente →</a>
    </nav>
  </div>
</header>

<section class="page-hero reveal">
  <div class="wrap">
    <h1>Mercati</h1>
    <p>Tutti gli strumenti disponibili — clicca su uno per prezzo, andamento e grafico.</p>
  </div>
</section>

<main>
  <div class="wrap" id="markets-container">
    <div id="status-msg"><span class="dots"><span></span><span></span><span></span></span></div>
  </div>
</main>

<footer>Meridian — versione dimostrativa.</footer>

<div class="modal-overlay" id="detail-modal">
  <div class="modal">
    <div class="modal-top">
      <h3 id="detail-name">—</h3>
      <button class="modal-close" id="detail-close">✕</button>
    </div>
    <div class="modal-sym" id="detail-sym">—</div>
    <div class="modal-price-row">
      <div class="modal-price" id="detail-price">—</div>
      <div id="detail-chg" class="chg">—</div>
    </div>
    <svg class="modal-chart" id="detail-chart" viewBox="0 0 400 80" preserveAspectRatio="none"></svg>
    <div id="detail-chart-status" style="margin-bottom:12px;"></div>
    <div class="modal-blurb" id="detail-blurb">—</div>
  </div>
</div>

<script>
const CATALOG = [
  {id:'bitcoin', type:'crypto', symbol:'BTC', name:'Bitcoin', category:'Crypto', blurb:"La prima criptovaluta al mondo, creata nel 2009 da un autore anonimo con lo pseudonimo Satoshi Nakamoto, pensata come moneta digitale decentralizzata al di fuori del controllo di banche e governi."},
  {id:'ethereum', type:'crypto', symbol:'ETH', name:'Ethereum', category:'Crypto', blurb:"La piattaforma che nel 2015 ha introdotto gli smart contract, alla base della maggior parte delle applicazioni decentralizzate e di migliaia di altri progetti crypto."},
  {id:'solana', type:'crypto', symbol:'SOL', name:'Solana', category:'Crypto', blurb:"Blockchain nata nel 2020, progettata per gestire un numero molto alto di transazioni al secondo con costi molto bassi rispetto a Bitcoin ed Ethereum."},
  {id:'ripple', type:'crypto', symbol:'XRP', name:'XRP', category:'Crypto', blurb:"Creata nel 2012 dall'azienda Ripple per velocizzare ed abbattere i costi dei pagamenti internazionali tra banche e istituzioni finanziarie."},
  {id:'cardano', type:'crypto', symbol:'ADA', name:'Cardano', category:'Crypto', blurb:"Blockchain lanciata nel 2017, sviluppata con un approccio accademico basato su ricerca scientifica sottoposta a revisione paritaria."},
  {id:'dogecoin', type:'crypto', symbol:'DOGE', name:'Dogecoin', category:'Crypto', blurb:"Nata nel 2013 come parodia scherzosa del mondo delle criptovalute, è diventata nel tempo una delle monete digitali più conosciute e scambiate al mondo."},
  {id:'litecoin', type:'crypto', symbol:'LTC', name:'Litecoin', category:'Crypto', blurb:"Una delle prime alternative a Bitcoin, lanciata nel 2011 con l'obiettivo di offrire transazioni più rapide ed economiche."},
  {id:'polkadot', type:'crypto', symbol:'DOT', name:'Polkadot', category:'Crypto', blurb:"Progetto che punta a collegare tra loro blockchain diverse e indipendenti, permettendo loro di scambiarsi dati e valore."},
  {id:'chainlink', type:'crypto', symbol:'LINK', name:'Chainlink', category:'Crypto', blurb:"Rete che collega i contratti intelligenti a dati provenienti dal mondo reale, come prezzi di mercato o eventi esterni."},
  {id:'avalanche-2', type:'crypto', symbol:'AVAX', name:'Avalanche', category:'Crypto', blurb:"Blockchain lanciata nel 2020, nota per la velocità con cui conferma le transazioni e per i costi contenuti."},
  {id:'tron', type:'crypto', symbol:'TRX', name:'Tron', category:'Crypto', blurb:"Piattaforma lanciata nel 2017, pensata inizialmente per contenuti digitali e intrattenimento decentralizzato."},
  {id:'binancecoin', type:'crypto', symbol:'BNB', name:'BNB', category:'Crypto', blurb:"Il token della piattaforma di scambio Binance, usato tra le altre cose per pagare le commissioni sulla rete a costi ridotti."},
  {id:'uniswap', type:'crypto', symbol:'UNI', name:'Uniswap', category:'Crypto', blurb:"Il token di uno dei più diffusi exchange decentralizzati, dove gli utenti scambiano criptovalute direttamente tra loro senza intermediari."},
  {id:'stellar', type:'crypto', symbol:'XLM', name:'Stellar', category:'Crypto', blurb:"Rete pensata per rendere veloce ed economico il trasferimento di denaro tra valute diverse, anche in aree con scarso accesso ai servizi bancari tradizionali."},
  {id:'cosmos', type:'crypto', symbol:'ATOM', name:'Cosmos', category:'Crypto', blurb:"Progetto che punta a collegare tra loro blockchain indipendenti, spesso descritto come 'l'internet delle blockchain'."},
  {id:'shiba-inu', type:'crypto', symbol:'SHIB', name:'Shiba Inu', category:'Crypto', blurb:"Nata nel 2020 come altra moneta 'a tema cane' ispirata a Dogecoin, con una community molto attiva online."},
  {id:'EUR/USD', type:'forex', symbol:'EUR/USD', name:'Euro / Dollaro', category:'Forex', blurb:"La coppia di valute più scambiata al mondo, che mette a confronto l'euro e il dollaro statunitense."},
  {id:'GBP/USD', type:'forex', symbol:'GBP/USD', name:'Sterlina / Dollaro', category:'Forex', blurb:"Conosciuta tra i trader come 'Cable', mette a confronto la sterlina britannica e il dollaro statunitense."},
  {id:'USD/JPY', type:'forex', symbol:'USD/JPY', name:'Dollaro / Yen', category:'Forex', blurb:"Una delle coppie più liquide del Forex, molto sensibile alle decisioni della Banca del Giappone."},
  {id:'USD/CHF', type:'forex', symbol:'USD/CHF', name:'Dollaro / Franco svizzero', category:'Forex', blurb:"Il franco svizzero è tradizionalmente considerato una valuta rifugio nei momenti di instabilità dei mercati."},
  {id:'AUD/USD', type:'forex', symbol:'AUD/USD', name:'Dollaro australiano / Dollaro USA', category:'Forex', blurb:"Molto legata all'andamento delle materie prime, data l'importanza dell'export minerario per l'economia australiana."},
  {id:'USD/CAD', type:'forex', symbol:'USD/CAD', name:'Dollaro USA / Dollaro canadese', category:'Forex', blurb:"Il dollaro canadese è spesso influenzato dal prezzo del petrolio, una delle principali esportazioni del Canada."},
  {id:'XAU/USD', type:'commodity', symbol:'XAU/USD', name:'Oro', category:'Materie prime', blurb:"Il prezzo dell'oro espresso in dollari, storicamente considerato un bene rifugio nei momenti di incertezza economica."},
  {id:'XAG/USD', type:'commodity', symbol:'XAG/USD', name:'Argento', category:'Materie prime', blurb:"Il prezzo dell'argento espresso in dollari: una materia prima sia industriale che d'investimento."}
];

async function loadMarkets(){
  const container = document.getElementById('markets-container');
  const cryptoIds = CATALOG.filter(c => c.type === 'crypto').map(c => c.id).join(',');
  const otherSymbols = CATALOG.filter(c => c.type !== 'crypto').map(c => c.symbol).join(',');

  let cryptoPrices = {}, otherQuotes = {};
  try{
    const r = await fetch('/api/instrument?ids=' + encodeURIComponent(cryptoIds));
    const d = await r.json();
    cryptoPrices = d.prices || {};
  }catch(e){}
  try{
    const r = await fetch('/api/quote?symbols=' + encodeURIComponent(otherSymbols));
    const d = await r.json();
    otherQuotes = d.quotes || {};
  }catch(e){}

  const categories = [...new Set(CATALOG.map(c => c.category))];
  container.innerHTML = categories.map(cat => {
    const items = CATALOG.filter(c => c.category === cat);
    return `
      <section class="cat-section reveal">
        <div class="cat-head"><h2>${cat}</h2><span>${items.length} strumenti</span></div>
        <div class="instr-grid">
          ${items.map(it => {
            const data = it.type === 'crypto' ? cryptoPrices[it.id] : otherQuotes[it.symbol];
            const price = data ? data.price : null;
            const chg = data ? data.changePct : null;
            return `
              <div class="instr-card" data-id="${it.id}">
                <div class="name">${it.name}</div>
                <div class="sym">${it.symbol}</div>
                <div class="price">${price != null ? '$' + price.toLocaleString('en-US') : '—'}</div>
                <div class="chg ${chg >= 0 ? 'up' : 'down'}">${chg != null ? (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%' : ''}</div>
              </div>
            `;
          }).join('')}
        </div>
      </section>
    `;
  }).join('');

  document.querySelectorAll('.instr-card').forEach(card => {
    card.addEventListener('click', async () => {
      const item = CATALOG.find(c => c.id === card.dataset.id);
      openDetailLoading(item);
      const fresh = await loadFullDetail(item);
      openDetail(fresh);
    });
  });

  document.querySelectorAll('.reveal').forEach(el => revealObserver.observe(el));
}

async function loadFullDetail(item){
  try{
    const url = item.type === 'crypto'
      ? '/api/instrument?id=' + encodeURIComponent(item.id)
      : '/api/quote?symbol=' + encodeURIComponent(item.symbol);
    const res = await fetch(url);
    const data = await res.json();
    return {...item, price: data.price, changePct: data.changePct, history: data.history || []};
  }catch(e){
    return {...item, price: null, changePct: null, history: []};
  }
}

const detailModal = document.getElementById('detail-modal');
function openDetailLoading(item){
  document.getElementById('detail-name').textContent = item.name;
  document.getElementById('detail-sym').textContent = item.symbol;
  document.getElementById('detail-price').textContent = '—';
  document.getElementById('detail-chg').textContent = '';
  document.getElementById('detail-blurb').textContent = item.blurb;
  document.getElementById('detail-chart').innerHTML = '';
  document.getElementById('detail-chart-status').innerHTML = '<span class="dots"><span></span><span></span><span></span></span>';
  detailModal.classList.add('open');
}
function openDetail(item){
  document.getElementById('detail-name').textContent = item.name;
  document.getElementById('detail-sym').textContent = item.symbol;
  document.getElementById('detail-price').textContent = item.price != null ? '$' + item.price.toLocaleString('en-US') : '—';
  const chg = document.getElementById('detail-chg');
  if(item.changePct != null){
    chg.textContent = (item.changePct >= 0 ? '+' : '') + item.changePct.toFixed(2) + '% (24h)';
    chg.className = 'chg ' + (item.changePct >= 0 ? 'up' : 'down');
  } else { chg.textContent = ''; }
  document.getElementById('detail-blurb').textContent = item.blurb;
  document.getElementById('detail-chart-status').innerHTML = '';
  drawSparkline(item.history, item.changePct == null ? true : item.changePct >= 0);
}
document.getElementById('detail-close').addEventListener('click', () => detailModal.classList.remove('open'));
detailModal.addEventListener('click', (e) => { if(e.target === detailModal) detailModal.classList.remove('open'); });

function drawSparkline(history, isUp){
  const svg = document.getElementById('detail-chart');
  const status = document.getElementById('detail-chart-status');
  if(!history || history.length < 2){
    svg.innerHTML = '';
    status.innerHTML = '<span style="font-size:13px;color:var(--muted);">Grafico non disponibile per questo strumento al momento.</span>';
    return;
  }
  const min = Math.min(...history), max = Math.max(...history);
  const range = max - min || 1;
  const points = history.map((v, i) => {
    const x = (i / (history.length - 1)) * 400;
    const y = 75 - ((v - min) / range) * 70;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const color = isUp ? '#4CAF7D' : '#E0616B';
  svg.innerHTML = `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2"/>`;
}

const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){ entry.target.classList.add('in'); revealObserver.unobserve(entry.target); }
  });
}, {threshold:0.1});

loadMarkets();
</script>

</body>
</html>
