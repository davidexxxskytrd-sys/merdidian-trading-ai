<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notizie — Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;--panel:#0A0A0A;--panel-2:#111111;--border:#232323;--border-soft:#1A1A1A;
    --text:#F2F2F2;--muted:#8A8A8A;--accent:#57B8FF;
  }
  *{box-sizing:border-box;} html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;position:relative;}
  a{color:inherit;}
  .wrap{max-width:760px;margin:0 auto;padding:0 24px;}

  .bg-fx{position:fixed;inset:0;z-index:-1;overflow:hidden;}
  .bg-fx::before{content:'';position:absolute;width:55vw;height:55vw;border-radius:50%;background:radial-gradient(circle, rgba(87,184,255,0.14), transparent 70%);top:-18%;left:-12%;filter:blur(10px);animation:drift1 24s ease-in-out infinite alternate;}
  .bg-fx::after{content:'';position:absolute;width:48vw;height:48vw;border-radius:50%;background:radial-gradient(circle, rgba(76,175,125,0.08), transparent 70%);bottom:-16%;right:-10%;filter:blur(10px);animation:drift2 28s ease-in-out infinite alternate;}
  .bg-grid{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(87,184,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(87,184,255,0.05) 1px, transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 100%);}
  @keyframes drift1{from{transform:translate(0,0);}to{transform:translate(6%,8%);}}
  @keyframes drift2{from{transform:translate(0,0);}to{transform:translate(-7%,-6%);}}

  .reveal{opacity:0;transform:translateY(14px);transition:opacity 0.5s ease, transform 0.5s ease;}
  .reveal.in{opacity:1;transform:translateY(0);}

  header{border-bottom:1px solid var(--border);padding:18px 0 14px;text-align:center;}
  .logo{font-size:19px;font-weight:700;margin-bottom:8px;}
  .logo em{font-style:normal;color:var(--accent);}
  nav{display:flex;gap:22px;font-size:13.5px;color:var(--muted);justify-content:center;flex-wrap:wrap;}
  nav a{text-decoration:none;transition:color 0.15s ease;}
  nav a:hover{color:var(--text);}
  nav a.current{color:var(--accent);}

  .page-hero{text-align:center;padding:38px 0 30px;}
  .page-hero h1{font-size:clamp(30px,5vw,44px);font-weight:800;letter-spacing:-1px;margin:0 0 10px;}
  .page-hero p{color:var(--muted);font-size:14.5px;margin:0;}

  main{padding:0 0 64px;}

  .news-card{
    border:1px solid var(--border);background:var(--panel);
    padding:22px 24px;margin-bottom:1px;
    transition:background 0.15s ease, transform 0.15s ease;
  }
  .news-card:hover{background:var(--panel-2);}
  .news-meta{font-size:12px;color:var(--muted);margin-bottom:8px;}
  .news-meta .tag{color:var(--accent);font-weight:600;}
  .news-card h2{font-weight:700;font-size:17.5px;margin:0 0 8px;line-height:1.35;}
  .news-card p{color:var(--muted);font-size:14px;margin:0;}

  .dots{display:inline-flex;gap:5px;align-items:center;padding:20px 0;}
  .dots span{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce 1.1s infinite ease-in-out;}
  .dots span:nth-child(2){animation-delay:0.15s;}
  .dots span:nth-child(3){animation-delay:0.3s;}
  @keyframes bounce{0%, 80%, 100%{transform:translateY(0);opacity:0.5;}40%{transform:translateY(-6px);opacity:1;}}
  #status-msg{color:var(--muted);font-size:14px;text-align:center;padding:30px 0;}

  footer{border-top:1px solid var(--border);padding:22px 0;color:var(--muted);font-size:12.5px;text-align:center;}
</style>
</head>
<body>

<div class="bg-fx"></div>
<div class="bg-grid"></div>

<header>
  <div class="wrap">
    <div class="logo">Meridian<em>.</em></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="news.html" class="current">Notizie</a>
      <a href="mercati.html">Mercati</a>
      <a href="school.html">Scuola del Trading</a>
      <a href="chat.html">Assistente →</a>
    </nav>
  </div>
</header>

<section class="page-hero reveal">
  <div class="wrap">
    <h1>Notizie</h1>
    <p>Quello che sta muovendo l'economia globale, aggiornato di continuo.</p>
  </div>
</section>

<main>
  <div class="wrap" id="news-container">
    <div id="status-msg"><span class="dots"><span></span><span></span><span></span></span></div>
  </div>
</main>

<footer>Meridian — versione dimostrativa.</footer>

<script>
async function loadNews(){
  const container = document.getElementById('news-container');
  try{
    const res = await fetch('/api/market?count=20');
    const data = await res.json();
    if(!data.news || data.news.length === 0){
      container.innerHTML = '<div id="status-msg">Nessuna notizia disponibile al momento. Controlla di aver attivato la chiave NEWS_API_KEY (vedi README).</div>';
      return;
    }
    container.innerHTML = data.news.map(n => `
      <div class="news-card reveal">
        <div class="news-meta"><span class="tag">${n.source}</span> · ${n.time}</div>
        <h2>${n.title}</h2>
        <p>${n.summary}</p>
      </div>
    `).join('');
    document.querySelectorAll('.reveal').forEach((el, i) => {
      el.style.transitionDelay = (i * 0.04) + 's';
      revealObserver.observe(el);
    });
  }catch(e){
    container.innerHTML = '<div id="status-msg">Non riesco a caricare le notizie in questo momento.</div>';
  }
}

const revealObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(entry.isIntersecting){ entry.target.classList.add('in'); revealObserver.unobserve(entry.target); }
  });
}, {threshold:0.1});

loadNews();
</script>

</body>
</html>
